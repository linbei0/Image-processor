[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "id-photo-background-tool"
version = "0.1.0"
description = "Windows 本地证件照换底工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "Pillow>=10.4",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.20",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-qt>=4.4",
]
gpu = [
  "onnxruntime-directml>=1.20; platform_system == 'Windows'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
